<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">望远镜的距离</title>
  <desc id="d">清晨的公园，一个人举着望远镜站在远处，望着树梢上一只小鸟。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e8eee7"/><stop offset=".55" stop-color="#d2dfd6"/><stop offset="1" stop-color="#c3d2c6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a9b79b"/><stop offset="1" stop-color="#7f8f72"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eef3ef" stop-opacity=".85"/><stop offset="1" stop-color="#eef3ef" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%">
      <stop stop-color="#fdf6de" stop-opacity=".9"/><stop offset="1" stop-color="#fdf6de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1210" cy="180" r="200" fill="url(#sun)"/>

  <!-- 远处树线 -->
  <g fill="#93a68f" opacity=".75">
    <path d="M0 470c60-40 90-14 140-30s80-46 132-40 66 34 118 30 76-42 130-40 84 40 132 42 82-30 130-26 92 40 152 36 96-32 156-28 96 32 160 34v92H0z"/>
  </g>
  <g fill="#7f9479" opacity=".85">
    <path d="M0 520c70-28 110-6 170-20s86-32 140-28 72 28 126 26 78-30 132-28 84 30 134 32 88-24 138-20 96 30 156 28 92-22 152-18V600H0z"/>
  </g>

  <!-- 地面 -->
  <path d="M0 596h1600v304H0z" fill="url(#ground)"/>
  <path d="M0 596c210 24 420 6 630 18s430 34 640 20 250-22 330-16v40H0z" fill="#94a487" opacity=".8"/>

  <!-- 小路 -->
  <path d="M250 900c120-90 210-150 300-210 68-46 120-72 176-96" stroke="#c8c2ab" stroke-width="86" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M250 900c120-90 210-150 300-210 68-46 120-72 176-96" stroke="#d6d0ba" stroke-width="58" fill="none" stroke-linecap="round" opacity=".8"/>

  <!-- 主树 -->
  <g>
    <path d="M1080 640c-6-120 4-210 26-286 10-36 14-72 8-108l46-6c10 62 4 118-8 166-14 58-16 138-10 234z" fill="#5d5141"/>
    <path d="M1114 470c34-30 64-58 96-92" stroke="#5d5141" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M1102 540c-30-24-58-40-92-54" stroke="#5d5141" stroke-width="13" fill="none" stroke-linecap="round"/>
    <g fill="#5a7554">
      <ellipse cx="1030" cy="330" rx="190" ry="120"/>
      <ellipse cx="1210" cy="300" rx="170" ry="112"/>
      <ellipse cx="1120" cy="230" rx="150" ry="96"/>
    </g>
    <g fill="#6b8863" opacity=".85">
      <ellipse cx="1000" cy="300" rx="110" ry="66"/>
      <ellipse cx="1180" cy="262" rx="104" ry="58"/>
      <ellipse cx="1112" cy="196" rx="86" ry="46"/>
    </g>
    <!-- 鸟 -->
    <g transform="translate(1276 372)">
      <ellipse cx="0" cy="0" rx="17" ry="11" fill="#3f4a44"/>
      <circle cx="13" cy="-6" r="8" fill="#46524b"/>
      <path d="M21 -6l9 3-9 3z" fill="#d8a44c"/>
      <path d="M-14 2l-16 6 14 4z" fill="#39443e"/>
      <circle cx="15" cy="-8" r="1.8" fill="#f3efe2"/>
      <path d="M-4 10v6M4 10v6" stroke="#3f4a44" stroke-width="2"/>
    </g>
  </g>

  <!-- 看鸟的人 -->
  <g transform="translate(470 556)" fill="#39443d">
    <ellipse cx="0" cy="148" rx="34" ry="8" fill="#3a4438" opacity=".25"/>
    <path d="M-16 76h32l16 68h-64z"/>
    <path d="M-12 82c-16-2-24-12-24-24 0-10 8-16 16-12" fill="none" stroke="#39443d" stroke-width="9" stroke-linecap="round"/>
    <path d="M12 82c18-6 26-18 24-32" fill="none" stroke="#39443d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="50" r="20"/>
    <!-- 望远镜 -->
    <g transform="translate(-2 44)">
      <rect x="-34" y="-7" width="30" height="16" rx="6" fill="#2c3530"/>
      <rect x="4" y="-7" width="30" height="16" rx="6" fill="#2c3530"/>
      <rect x="-38" y="-4" width="8" height="10" rx="3" fill="#5b6a5f"/>
      <rect x="30" y="-4" width="8" height="10" rx="3" fill="#5b6a5f"/>
    </g>
  </g>

  <!-- 晨雾 -->
  <rect y="470" width="1600" height="150" fill="url(#mist)"/>

  <!-- 草丛细节 -->
  <g stroke="#6f8064" stroke-width="3" fill="none" opacity=".8">
    <path d="M180 830c4-18 2-30-2-44M196 832c6-16 8-28 6-42M212 830c2-14 0-26-4-38"/>
    <path d="M860 812c4-16 2-28-2-40M876 814c6-14 8-26 6-38"/>
    <path d="M1420 846c4-18 2-30-2-44M1436 848c6-16 8-28 6-42"/>
  </g>

  <!-- 文字 -->
  <text x="104" y="132" fill="#33443b" font-family="serif" font-size="58" letter-spacing="10">望远镜的距离</text>
  <text x="110" y="186" fill="#6c8073" font-family="sans-serif" font-size="19" letter-spacing="4.5">THE DISTANCE OF BINOCULARS</text>
  <path d="M108 210h380" stroke="#7f9479" stroke-width="1.5" opacity=".7"/>
</svg>
