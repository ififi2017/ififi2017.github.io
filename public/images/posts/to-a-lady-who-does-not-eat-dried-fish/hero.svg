<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">给一位不吃小鱼干的小姐</title>
  <desc id="d">深夜的书桌，一盏台灯照亮一张写了一半的谢帖，桌角一只猫安静趴着，窗外是城市和一条鱼形的星。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop stop-color="#0a1119"/><stop offset=".55" stop-color="#12202c"/><stop offset="1" stop-color="#1b2a33"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4a3628"/><stop offset="1" stop-color="#1d1511"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f6d79a" stop-opacity=".42"/><stop offset="1" stop-color="#f6d79a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop stop-color="#ffe6b0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16283a"/><stop offset="1" stop-color="#2b4356"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6eeda"/><stop offset="1" stop-color="#e2d4b7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 鱼形星 -->
  <g opacity=".75">
    <path d="M150 250 C 235 195, 360 205, 430 262 C 360 322, 235 330, 150 250 Z" fill="none" stroke="#8fb6c4" stroke-opacity=".35" stroke-width="2"/>
    <path d="M430 262 L 505 205 L 512 322 Z" fill="none" stroke="#8fb6c4" stroke-opacity=".32" stroke-width="2"/>
    <circle cx="196" cy="252" r="3.5" fill="#cfe6ea"/><circle cx="262" cy="235" r="2.6" fill="#cfe6ea"/>
    <circle cx="330" cy="243" r="3" fill="#cfe6ea"/><circle cx="392" cy="262" r="2.4" fill="#cfe6ea"/>
    <circle cx="470" cy="230" r="2.2" fill="#cfe6ea"/><circle cx="470" cy="298" r="2.2" fill="#cfe6ea"/>
    <circle cx="150" cy="250" r="2.6" fill="#cfe6ea"/>
  </g>

  <!-- 窗 -->
  <g transform="translate(1060 92)">
    <rect x="-14" y="-14" width="458" height="446" rx="4" fill="#0e1a24"/>
    <rect width="430" height="418" fill="url(#win)"/>
    <path d="M70 418 L 60 300 L 118 302 L 128 418 Z" fill="#0b1520"/>
    <path d="M160 418 L 152 258 L 214 260 L 222 418 Z" fill="#0b1520"/>
    <path d="M270 418 L 262 322 L 320 320 L 330 418 Z" fill="#0b1520"/>
    <path d="M356 418 L 350 288 L 412 290 L 418 418 Z" fill="#0b1520"/>
    <g fill="#f2cf8a" opacity=".85">
      <rect x="88" y="352" width="9" height="6"/><rect x="180" y="330" width="8" height="5"/>
      <rect x="286" y="362" width="10" height="6"/><rect x="374" y="340" width="7" height="5"/>
      <rect x="104" y="392" width="6" height="4"/><rect x="392" y="386" width="6" height="4"/>
    </g>
    <circle cx="344" cy="92" r="30" fill="#e8e2c2" opacity=".78"/>
    <path d="M215 0v418M0 206h430" stroke="#0e1a24" stroke-width="14"/>
  </g>

  <!-- 桌面 -->
  <rect y="618" width="1600" height="282" fill="url(#desk)"/>
  <path d="M0 618h1600" stroke="#7a5b41" stroke-opacity=".5" stroke-width="3"/>
  <path d="M0 726h1600M0 812h1600" stroke="#2b1e18" stroke-opacity=".55" stroke-width="2"/>

  <!-- 灯光 -->
  <ellipse cx="700" cy="720" rx="480" ry="250" fill="url(#halo)"/>
  <path d="M232 470 L 452 640 L 1050 640 L 1090 470 Z" fill="url(#glow)" filter="url(#soft)" opacity=".85"/>
  <g>
    <path d="M170 640h132l-14-14H184z" fill="#20180f"/>
    <rect x="226" y="470" width="12" height="160" fill="#2a2016"/>
    <path d="M196 470 L 262 470 L 296 528 L 168 528 Z" fill="#c9a25f"/>
    <path d="M186 528h110l6 10H180z" fill="#8d6a37"/>
    <ellipse cx="232" cy="640" rx="74" ry="9" fill="#0f0b08" opacity=".7"/>
  </g>

  <!-- 谢帖 -->
  <g transform="translate(560 560) rotate(-6)">
    <rect x="6" y="10" width="360" height="228" rx="4" fill="#0c0906" opacity=".45"/>
    <rect width="360" height="228" rx="4" fill="url(#paper)"/>
    <g fill="#6b5a44" opacity=".55">
      <rect x="34" y="40" width="230" height="7" rx="3.5"/>
      <rect x="34" y="64" width="286" height="6" rx="3"/>
      <rect x="34" y="86" width="262" height="6" rx="3"/>
      <rect x="34" y="108" width="276" height="6" rx="3"/>
      <rect x="34" y="130" width="180" height="6" rx="3"/>
    </g>
    <!-- 爪印 -->
    <g fill="#c2554a" opacity=".8">
      <ellipse cx="292" cy="176" rx="17" ry="13"/>
      <circle cx="275" cy="153" r="5"/><circle cx="291" cy="147" r="5"/>
      <circle cx="307" cy="150" r="5"/><circle cx="318" cy="163" r="4"/>
    </g>
  </g>

  <!-- 玫瑰 -->
  <g transform="translate(474 496) scale(1.22)">
    <path d="M18 148c-4-26 2-52 4-74" stroke="#3f5a3a" stroke-width="4" fill="none"/>
    <path d="M20 108c-16-6-26-18-28-30 16 0 26 8 30 20" fill="#405f3c"/>
    <path d="M22 92c14-10 20-22 18-34-14 4-22 12-24 24" fill="#4a6b44"/>
    <g>
      <circle cx="22" cy="58" r="22" fill="#a83a46"/>
      <path d="M22 40c10 2 16 10 14 20s-10 16-18 14" fill="#c04f5a"/>
      <path d="M8 54c6-8 18-10 26-4" stroke="#64202a" stroke-width="2.5" fill="none"/>
    </g>
    <path d="M-2 148h48l-6 44H6z" fill="#243642"/>
    <path d="M-2 148h48l-1 8H-2z" fill="#31485a"/>
  </g>

  <!-- 猫 -->
  <g fill="#0c151d" stroke="#4a6b80" stroke-opacity=".45" stroke-width="2">
    <path d="M1246 640c-28 0-52-14-58-42-6-30 14-52 12-92-2-36 22-62 58-62s60 26 58 62c-2 40 18 62 12 92-6 28-30 42-58 42z"/>
    <path d="M1204 448c-12-18-14-38 2-44 12-5 22 6 28 20" />
    <path d="M1330 448c12-18 14-38-2-44-12-5-22 6-28 20"/>
    <path d="M1250 574c-34 0-56 22-56 44h112c0-22-22-44-56-44z"/>
    <path d="M1330 636c52 6 86-26 76-64-8-30-44-32-56-14" fill="none" stroke="#0c151d" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g fill="#c9a25f" opacity=".9">
    <circle cx="1224" cy="522" r="5"/><circle cx="1276" cy="522" r="5"/>
  </g>
  <path d="M1250 470c-6-8-18-8-22 2M1288 472c4-8 16-8 20 0" stroke="#2c3d4a" stroke-width="3" fill="none" opacity=".7"/>
  <ellipse cx="1250" cy="640" rx="110" ry="12" fill="#070d12" opacity=".65"/>

  <!-- 文字 -->
  <text x="108" y="128" fill="#ece2cd" font-family="serif" font-size="56" letter-spacing="9">给一位不吃小鱼干的小姐</text>
  <text x="113" y="182" fill="#a9c2cd" font-family="sans-serif" font-size="20" letter-spacing="4.5">TO A LADY WHO DOES NOT EAT DRIED FISH</text>
  <path d="M112 206h412" stroke="#c9a25f" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
